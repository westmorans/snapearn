<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snapearn STK Push Bot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-bottom: 20px; text-align: center; font-size: 1.8rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #94a3b8; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    textarea { height: 120px; font-family: monospace; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #0284c7; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .logs { margin-top: 20px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; }
    .log-item { margin-bottom: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .log-success { color: #4ade80; }
    .log-failed { color: #f87171; }
    .log-info { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Snapearn STK Push Bot</h1>
    <form id="stkForm">
      <div class="form-group">
        <label>Phone Numbers (Comma or Newline separated):</label>
        <textarea id="numbers" placeholder="0712345678, 0787654321&#10;0700112233" required></textarea>
      </div>
      <div class="form-group">
        <label>Amount (KES):</label>
        <input type="number" id="amount" value="10" required />
      </div>
      <div class="form-group">
        <label>Reference:</label>
        <input type="text" id="reference" value="PAYMENT" />
      </div>
      <div class="form-group">
        <label>Description:</label>
        <input type="text" id="description" value="Bulk STK Push" />
      </div>
      <button type="submit" id="submitBtn">Start Bulk STK Push</button>
    </form>

    <div class="logs" id="logs">
      <div class="log-item log-info">> Ready to send requests with 6s delay.</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('stkForm');
    const submitBtn = document.getElementById('submitBtn');
    const logsContainer = document.getElementById('logs');

    function log(msg, type = 'info') {
      const item = document.createElement('div');
      item.className = `log-item log-${type}`;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logsContainer.appendChild(item);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const rawNumbers = document.getElementById('numbers').value;
      const numbers = rawNumbers.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);
      const amount = document.getElementById('amount').value;
      const reference = document.getElementById('reference').value;
      const description = document.getElementById('description').value;

      if (numbers.length === 0) return alert('Enter at least one number.');

      submitBtn.disabled = true;
      log(`Starting STK Push for ${numbers.length} numbers...`, 'info');

      try {
        const response = await fetch('/api/bulk-stk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numbers, amount, reference, description })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.replace('data: ', ''));

              if (data.type === 'progress') {
                const statusType = data.status === 'SUCCESS' ? 'success' : 'failed';
                log(`[${data.index}/${data.total}] ${data.phone} -> ${data.status}: ${JSON.stringify(data.response || data.error)}`, statusType);
              } else if (data.type === 'delay') {
                log(`Waiting 6 seconds before next request...`, 'info');
              } else if (data.type === 'complete') {
                log(`Completed bulk process.`, 'info');
              }
            }
          }
        }
      } catch (err) {
        log(`Error: ${err.message}`, 'failed');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
